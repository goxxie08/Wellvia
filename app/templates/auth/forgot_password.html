{% extends 'base.html' %}

{% block title %}Password Recovery - Student Wellness{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center py-4 py-md-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <div class="auth-card card border-0 shadow-lg overflow-hidden position-relative">
                    <!-- Top subtle accent bar -->
                    <div class="auth-card-top-bar"></div>

                    <div class="card-body p-4 p-sm-5">
                        <!-- Branding / Logo -->
                        <div class="text-center mb-4">
                            <div class="auth-logo-icon-wrapper mb-3 mx-auto">
                                <i class="bi bi-shield-lock-fill text-teal"></i>
                            </div>
                            <span class="badge bg-teal-subtle text-teal fw-semibold px-3 py-1 mb-2 rounded-pill small">
                                <i class="bi bi-heart-pulse-fill me-1"></i> Student Wellness
                            </span>
                            <h1 class="h3 fw-bold mb-2 text-dark brand-font">Password Recovery</h1>
                            <p class="text-muted small mb-0">Enter your student email address and we'll send you instructions to reset your password.</p>
                        </div>

                        <!-- Recovery Form -->
                        <form action="{{ url_for('auth.forgot_password') }}" method="POST" novalidate>
                            <div class="mb-4">
                                <label for="email" class="form-label font-weight-bold small text-uppercase tracking-wide text-secondary">
                                    Student Email
                                </label>
                                <div class="input-group auth-input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0 px-3">
                                        <i class="bi bi-envelope-fill fs-6 text-teal"></i>
                                    </span>
                                    <input type="email" 
                                           class="form-control form-control-custom border-start-0 ps-0" 
                                           id="email" 
                                           name="email" 
                                           placeholder="student@wellvia.edu" 
                                           required 
                                           autofocus>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 fw-bold fs-6 shadow-sm mb-3">
                                <i class="bi bi-send-fill me-2"></i> Send Reset Link
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a href="{{ url_for('auth.login') }}" class="auth-link d-inline-flex align-items-center gap-1 font-weight-semibold text-teal text-decoration-none">
                                <i class="bi bi-arrow-left"></i> Return to Login
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
