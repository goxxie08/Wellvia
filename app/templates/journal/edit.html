{% extends 'base.html' %}

{% block title %}Edit Gratitude Entry{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-4 shadow-sm">
            <h4 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2 text-primary"></i> Edit Gratitude Reflection</h4>
            <p class="small text-muted mb-3">Date: {{ entry.entry_date }}</p>

            <form action="{{ url_for('student.edit_journal', entry_id=entry.id) }}" method="POST">
                <div class="mb-4">
                    <label for="content" class="form-label small fw-bold">Journal Content</label>
                    <textarea class="form-control form-control-custom" id="content" name="content" rows="8" required>{{ entry.content }}</textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('student.journal') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary-gradient px-4">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
