{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-muted mb-3">404</div>
    <h2 class="fw-bold mb-2">Page Not Found</h2>
    <p class="text-muted mb-4">The page or resource you requested could not be found.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary-gradient">
        <i class="bi bi-house-door me-2"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
