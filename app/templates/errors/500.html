{% extends 'base.html' %}
{% block title %}500 - Internal Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-warning mb-3">500</div>
    <h2 class="fw-bold mb-2">Internal Server Error</h2>
    <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary-gradient">
        <i class="bi bi-house-door me-2"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
