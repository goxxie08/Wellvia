{% extends 'base.html' %}
{% block title %}403 - Forbidden{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-3"><i class="bi bi-shield-lock"></i> 403</div>
    <h2 class="fw-bold mb-2">Access Denied</h2>
    <p class="text-muted mb-4">You do not have permission to view or interact with this resource.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary-gradient">
        <i class="bi bi-house-door me-2"></i> Return to Safety
    </a>
</div>
{% endblock %}
